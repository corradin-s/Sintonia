name: probe (one-off)
on: { push: { branches: [probe-links], paths: [nopal.sh, .github/workflows/probe-links.yml] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash nopal.sh
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add nopal.txt; git commit -m "nopal results"; git push
