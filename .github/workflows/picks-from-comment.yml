# A reply from the owner on the weekly schedule issue: three numbers fill This week (picks.json),
# "evento ok" publishes the event proposed under the issue (events.json, already in the test copy).
name: This week picks
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pages: write
# two replies in a row are handled one after the other
concurrency:
  group: this-week-picks
  cancel-in-progress: false
jobs:
  picks:
    if: startsWith(github.event.issue.title, 'Palinsesti ') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/picks-from-comment.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
      - name: Save and publish
        run: |
          [ -s changed.txt ] || { echo "nothing changed by this reply"; exit 0; }
          # start from the latest main, so only the files this reply changed are saved, even if main moved in the meantime
          git fetch -q origin main
          git reset -q origin/main
          while read -r f; do [ -n "$f" ] && git add -- "$f"; done < changed.txt
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "This week: from the schedule issue #${{ github.event.issue.number }} ($(tr '\n' ' ' < changed.txt))"
          git push origin HEAD:main
          # a push made with this token doesn't start the Pages build by itself
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reply
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file picks-reply.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
